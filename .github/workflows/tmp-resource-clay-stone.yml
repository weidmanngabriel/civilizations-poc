name: Temporary clay and stone implementation

on:
  push:
    branches:
      - tmp/resource-clay-stone

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/resource-clay-stone
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/tmp-add-clay-stone.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add clay and stone construction chains"
          git push origin HEAD:tmp/resource-clay-stone
