name: Character Lab visual review

on:
  push:
    branches: [main]
    paths:
      - "character-lab/**"
      - "scripts/capture-character-lab.mjs"
      - "vite.character-lab.config.ts"
      - "tsconfig.character-lab.json"
      - "src/pwa.ts"
      - "src/pwa.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/character-lab-review.yml"
  pull_request:
    branches: [main]
    paths:
      - "character-lab/**"
      - "scripts/capture-character-lab.mjs"
      - "vite.character-lab.config.ts"
      - "tsconfig.character-lab.json"
      - "src/pwa.ts"
      - "src/pwa.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/character-lab-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build Character Lab only
        run: npm run build:character-lab
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Capture Character Lab review media
        run: npm run capture:character-lab -- woodcut 21
      - name: Upload Character Lab review media
        uses: actions/upload-artifact@v4
        with:
          name: character-lab-review-${{ github.sha }}
          path: |
            character-lab/review-output/woodcut/*.png
            character-lab/review-output/woodcut/*.webm
          retention-days: 14
