name: Apply bakery balance patch

on:
  push:
    branches:
      - feature/bakery-balanced-inputs
    paths:
      - .github/workflows/apply-bakery-balance.yml
      - .github/scripts/apply_bakery_balance.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bakery-balanced-inputs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python .github/scripts/apply_bakery_balance.py
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Balance bakery inputs and output"
          git push origin HEAD:feature/bakery-balanced-inputs
