name: Temporary extractor pool implementation

on:
  push:
    branches:
      - tmp/resource-extractor-pools

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/resource-extractor-pools
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/tmp-add-extractor-pools.mjs
      - run: node scripts/tmp-fix-extractor-test.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Remove temporary implementation helpers
        run: |
          rm scripts/tmp-add-extractor-pools.mjs
          rm scripts/tmp-fix-extractor-test.mjs
          rm .github/workflows/tmp-resource-extractor-pools.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add clay and stone extractor pools"
          git push origin HEAD:tmp/resource-extractor-pools
