name: Agent sleep performance patch

on:
  push:
    branches:
      - perf/sleep-target-search

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sleep-target-search
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply sleep performance patch
        shell: python
        run: |
          from pathlib import Path

          sleep = Path('src/simulation/sleep.ts')
          text = sleep.read_text()

          old_import = 'import { GRID_REFINEMENT } from "./spatial";'
          new_import = 'import { GRID_REFINEMENT, hexDistance } from "./spatial";'
          if old_import not in text:
              raise SystemExit('spatial import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_block = '''type SleepCandidate = { kind: Exclude<SleepLocationKind, "ground">; target: Hex; path: Hex[]; cost: number };

const natureTargets = (world: World): Hex[] => {
  const targets = new Map<string, Hex>();
  for (const resource of world.naturalResources) {
    if (resource.kind !== "forest" || resource.depleted) continue;
    targets.set(key(resource.position), { ...resource.position });
  }
  for (const tile of world.tiles) {
    if (tile.terrain !== "grass" || !tile.bush) continue;
    targets.set(key(tile), { q: tile.q, r: tile.r });
  }
  return [...targets.values()];
};

const bestCandidate = (world: World, person: Person, kind: "house" | "nature"): SleepCandidate | undefined => {
  const targets = kind === "house" ? world.buildings.filter(isCompletedHouse).map((building) => building.position) : natureTargets(world);
  const candidates = targets
    .filter((target) => withinSleepRadius(world, person.position, target))
    .map((target) => {
      const path = routeTo(world, person, target);
      if (!path) return undefined;
      return { kind, target, path, cost: pathTravelCost(world.tiles, path, CONFIG.roadSpeedMultiplier) } as SleepCandidate;
    })
    .filter((candidate): candidate is SleepCandidate => Boolean(candidate));
  candidates.sort((a, b) => a.cost - b.cost || a.target.r - b.target.r || a.target.q - b.target.q);
  return candidates[0];
};

const chooseSleepTarget = (world: World, person: Person): SleepCandidate | { kind: "ground"; target: Hex; path: Hex[] } =>
  bestCandidate(world, person, "house") ?? bestCandidate(world, person, "nature") ?? { kind: "ground", target: { ...person.position }, path: [] };'''

          new_block = '''type SleepCandidate = { kind: Exclude<SleepLocationKind, "ground">; target: Hex; path: Hex[]; cost: number };
type SleepSearchContext = { houses?: Hex[]; nature?: Hex[] };

const natureTargets = (world: World): Hex[] => {
  const targets = new Map<string, Hex>();
  for (const resource of world.naturalResources) {
    if (resource.kind !== "forest" || resource.depleted) continue;
    targets.set(key(resource.position), { ...resource.position });
  }
  for (const tile of world.tiles) {
    if (tile.terrain !== "grass" || !tile.bush) continue;
    targets.set(key(tile), { q: tile.q, r: tile.r });
  }
  return [...targets.values()];
};

const searchTargets = (world: World, context: SleepSearchContext, kind: "house" | "nature"): Hex[] => {
  if (kind === "house") {
    context.houses ??= world.buildings.filter(isCompletedHouse).map((building) => building.position);
    return context.houses;
  }
  context.nature ??= natureTargets(world);
  return context.nature;
};

const bestCandidate = (
  world: World,
  person: Person,
  kind: "house" | "nature",
  context: SleepSearchContext,
): SleepCandidate | undefined => {
  const targets = searchTargets(world, context, kind)
    .map((target) => {
      const distance = hexDistance(person.position, target);
      return {
        target,
        distance,
        lowerBound: distance / CONFIG.roadSpeedMultiplier,
      };
    })
    .filter((candidate) => candidate.distance <= SLEEP_RADIUS_STEPS)
    .sort((a, b) => a.lowerBound - b.lowerBound || a.target.r - b.target.r || a.target.q - b.target.q);

  let best: SleepCandidate | undefined;
  for (const candidate of targets) {
    if (best && candidate.lowerBound > best.cost + ACCUMULATOR_EPSILON) break;
    if (!withinSleepRadius(world, person.position, candidate.target)) continue;
    const path = routeTo(world, person, candidate.target);
    if (!path) continue;
    const cost = pathTravelCost(world.tiles, path, CONFIG.roadSpeedMultiplier);
    if (
      !best ||
      cost < best.cost - ACCUMULATOR_EPSILON ||
      (Math.abs(cost - best.cost) <= ACCUMULATOR_EPSILON &&
        (candidate.target.r < best.target.r ||
          (candidate.target.r === best.target.r && candidate.target.q < best.target.q)))
    ) best = { kind, target: candidate.target, path, cost };
  }
  return best;
};

const chooseSleepTarget = (
  world: World,
  person: Person,
  context: SleepSearchContext,
): SleepCandidate | { kind: "ground"; target: Hex; path: Hex[] } =>
  bestCandidate(world, person, "house", context) ??
  bestCandidate(world, person, "nature", context) ??
  { kind: "ground", target: { ...person.position }, path: [] };'''

          if old_block not in text:
              raise SystemExit('candidate block anchor not found')
          text = text.replace(old_block, new_block, 1)

          text = text.replace(
              'const startSleeping = (world: World, person: Person): void => {\n  const candidate = chooseSleepTarget(world, person);',
              'const startSleeping = (world: World, person: Person, context: SleepSearchContext): void => {\n  const candidate = chooseSleepTarget(world, person, context);',
              1,
          )
          text = text.replace(
              'const applyReplacementTarget = (world: World, person: Person, state: SleepState): void => {\n  const replacement = chooseSleepTarget(world, person);',
              'const applyReplacementTarget = (world: World, person: Person, state: SleepState, context: SleepSearchContext): void => {\n  const replacement = chooseSleepTarget(world, person, context);',
              1,
          )
          text = text.replace(
              'const ensureSleepRouteOrProgress = (world: World, person: Person): void => {',
              'const ensureSleepRouteOrProgress = (world: World, person: Person, context: SleepSearchContext): void => {',
              1,
          )
          text = text.replace('applyReplacementTarget(world, person, state); return;', 'applyReplacementTarget(world, person, state, context); return;')
          text = text.replace('if (!reroute) applyReplacementTarget(world, person, state);', 'if (!reroute) applyReplacementTarget(world, person, state, context);')

          old_tick = '''export function advanceSleepTick(world: World): void {
  const started = performanceNow();
  try {
    for (const person of world.people) {
      sleepValue(person);
      if (person.sleepGraceTicks! > 0) person.sleepGraceTicks!--;
      if (person.sleepState) { ensureSleepRouteOrProgress(world, person); continue; }
      decaySleep(person);
      if (person.hungerState || (person.hunger ?? 100) <= 40) continue;
      if (person.sleepGraceTicks! > 0) continue;
      if (person.sleep! <= CRITICAL_SLEEP_THRESHOLD) { startSleeping(world, person); continue; }
      if (person.sleep! <= WANTS_TO_SLEEP_THRESHOLD && atTaskBoundary(person)) startSleeping(world, person);
    }
  } finally {
    performanceProfiler.recordFeature("sleep", performanceNow() - started);
  }
}'''
          new_tick = '''export function advanceSleepTick(world: World): void {
  const started = performanceNow();
  const searchContext: SleepSearchContext = {};
  try {
    for (const person of world.people) {
      sleepValue(person);
      if (person.sleepGraceTicks! > 0) person.sleepGraceTicks!--;
      if (person.sleepState) { ensureSleepRouteOrProgress(world, person, searchContext); continue; }
      decaySleep(person);
      if (person.hungerState || (person.hunger ?? 100) <= 40) continue;
      if (person.sleepGraceTicks! > 0) continue;
      if (person.sleep! <= CRITICAL_SLEEP_THRESHOLD) { startSleeping(world, person, searchContext); continue; }
      if (person.sleep! <= WANTS_TO_SLEEP_THRESHOLD && atTaskBoundary(person)) startSleeping(world, person, searchContext);
    }
  } finally {
    performanceProfiler.recordFeature("sleep", performanceNow() - started);
  }
}'''
          if old_tick not in text:
              raise SystemExit('sleep tick anchor not found')
          text = text.replace(old_tick, new_tick, 1)
          sleep.write_text(text)

          architecture = Path('architecture.md')
          text = architecture.read_text()
          old_arch = 'Natural-resource depletion retirement is event-driven; there is no periodic full resource-list cleanup scan. Farm physical-obstacle state is built once per farm-system tick, and road resource footprints once per movement tick. The movement hot path reuses the cached tile index instead of linearly scanning the full fine-grid tile array for every traversed micro-cell; arrival/reroute bookkeeping is profiled separately from traversal. Placement anchor enumeration reuses indexed lookups. Further optimization should be driven by `src/debug/performanceProfiler.ts`, not speculative cache layers.'
          new_arch = 'Natural-resource depletion retirement is event-driven; there is no periodic full resource-list cleanup scan. Farm physical-obstacle state is built once per farm-system tick, and road resource footprints once per movement tick. The movement hot path reuses the cached tile index instead of linearly scanning the full fine-grid tile array for every traversed micro-cell; arrival/reroute bookkeeping is profiled separately from traversal. Sleep-target planning first applies a geometric radius/lower-bound filter and shares lazily built house/nature target lists across all sleep decisions in the same simulation tick before running exact reachability and road-aware routing. Placement anchor enumeration reuses indexed lookups. Further optimization should be driven by `src/debug/performanceProfiler.ts`, not speculative cache layers.'
          if old_arch not in text:
              raise SystemExit('architecture anchor not found')
          architecture.write_text(text.replace(old_arch, new_arch, 1))

          Path('.github/workflows/agent-sleep-performance.yml').unlink()

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: reduce sleep target search work"
          git push origin HEAD:perf/sleep-target-search
