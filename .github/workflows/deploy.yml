name: Agent resource cleanup test
on:
  push:
    branches: [perf/resource-cleanup-local-planning]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Apply resource cleanup refactor
        shell: python
        run: |
          from pathlib import Path

          engine = Path('src/simulation/simulationCoreEngine.ts')
          text = engine.read_text()
          old = '''function retireDepletedResources(
  w: World,
  resources: readonly NaturalResource[],
): void {
  for (const resource of resources) {
    if (resource.depleted || resource.remaining !== 0) continue;
    resource.depleted = true;
    const tile = tileAt(w, resource.position);
    if (resource.kind === "forest") tile.terrain = "grass";
    tile.trafficTicks = undefined;
    for (const person of resourceWorkers(w, resource.id)) {
      person.resourceTarget = undefined;
      person.active = false;
      person.progress = 0;
      person.movement = 0;
      person.path = [];
      if (person.woodcutter) assignNaturalWorker(w, person, "forest");
      else if (person.extractor) assignNaturalWorker(w, person, person.extractor);
      else route(w, person, building(w, "hq"), "reroute");
    }
  }
}'''
          new = '''function retireDepletedResources(
  w: World,
  resources: readonly NaturalResource[],
): void {
  for (const resource of resources) {
    if (resource.depleted || resource.remaining !== 0) continue;
    resource.depleted = true;
    const tile = tileAt(w, resource.position);
    if (resource.kind === "forest") tile.terrain = "grass";
    tile.trafficTicks = undefined;
    for (const person of resourceWorkers(w, resource.id)) {
      person.resourceTarget = undefined;
      person.active = false;
      person.progress = 0;
      person.movement = 0;
      person.path = [];
      if (!person.woodcutter && !person.extractor)
        route(w, person, building(w, "hq"), "reroute");
    }
  }
}'''
          if old not in text:
              raise SystemExit('retireDepletedResources anchor not found')
          engine.write_text(text.replace(old, new, 1))

          core = Path('src/simulation/simulationCore.ts')
          text = core.read_text()
          text = text.replace('import { CONFIG } from "./scenario";\n', '', 1)
          text = text.replace('import { extractionSpeedMultiplier } from "./experience";\n', '', 1)
          old = '''function legacyResourcePlanningGuard(world: World): Set<number> {
  const guarded = new Set<number>();
  for (const person of world.people) {
    if (!person.workArea || (!person.woodcutter && !person.extractor)) continue;
    if (!person.resourceTarget) {
      guarded.add(person.id);
      continue;
    }
    if (
      !person.active ||
      person.path.length ||
      person.trip ||
      person.farmTask ||
      person.hungerState ||
      person.sleepState ||
      person.progress <= 0
    ) continue;
    const resource = world.naturalResources.find(
      (candidate) => candidate.id === person.resourceTarget,
    );
    if (
      !resource ||
      resource.depleted ||
      resource.remaining !== 1 ||
      !samePosition(person.position, resource.position)
    ) continue;
    const profession =
      resource.kind === "forest"
        ? "woodcutter"
        : resource.kind === "clay"
          ? "clayDigger"
          : "stonecutter";
    if (person.progress + extractionSpeedMultiplier(person, profession) >= CONFIG.duration)
      guarded.add(person.id);
  }
  return guarded;
}

/**
 * The historical engine still tries global extractor planning during resource cleanup
 * and one-second idle retries. Local work areas own that decision now. The adapter
 * suppresses only those legacy decisions after the needs check has run, then restores
 * the real hunger values before local work-area planning.
 */
function tickWithoutLegacyGlobalResourcePlanning(world: World): void {
  const guardedIds = legacyResourcePlanningGuard(world);
  if (!guardedIds.size) {
    tickNow(world);
    return;
  }

  const originalHunger = new Map<number, number | undefined>();
  const tickWorld = new Proxy(world, {
    set(target, property, value, receiver) {
      const changed = Reflect.set(target, property, value, receiver);
      if (!changed || property !== "round" || typeof value !== "number") return changed;
      for (const id of guardedIds) {
        const person = world.people.find((candidate) => candidate.id === id);
        if (!person || person.hungerState || (person.hunger ?? 100) <= 40) continue;
        if (!originalHunger.has(id)) originalHunger.set(id, person.hunger);
        person.hunger = 40;
      }
      return changed;
    },
  });

  try {
    tickNow(tickWorld);
  } finally {
    for (const [id, hunger] of originalHunger) {
      const person = world.people.find((candidate) => candidate.id === id);
      if (person) person.hunger = hunger;
    }
  }
}

'''
          if old not in text:
              raise SystemExit('legacy resource planning guard anchor not found')
          text = text.replace(old, '', 1)
          text = text.replace('  tickWithoutLegacyGlobalResourcePlanning(world);', '  tickNow(world);', 1)
          core.write_text(text)

          architecture = Path('architecture.md')
          text = architecture.read_text()
          old = '`simulationCore.ts` still suppresses the historical whole-map extractor replanning paths during depletion/idle retry; `syncWorkAreas()` owns the authoritative local retry.'
          new = '`syncWorkAreas()` owns authoritative extractor/resource replanning after depletion and during idle retry. The historical core now limits depletion handling to retirement/reset cleanup and no longer performs a competing whole-map extractor replan.'
          if old not in text:
              raise SystemExit('architecture work-area anchor not found')
          text = text.replace(old, new, 1)
          old = 'Natural-resource depletion retirement is event-driven; there is no periodic full resource-list cleanup scan.'
          new = 'Natural-resource depletion retirement is event-driven and limited to retirement/reset bookkeeping; subsequent extractor target selection is handled once by local work-area planning after the core tick. There is no periodic full resource-list cleanup scan or depletion-time whole-map extractor replan.'
          if old not in text:
              raise SystemExit('architecture performance anchor not found')
          architecture.write_text(text.replace(old, new, 1))
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit tested refactor
        run: |
          git checkout origin/main -- .github/workflows/deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: remove legacy depletion replanning"
          git push origin HEAD:perf/resource-cleanup-local-planning
