name: Temporary extractor pool validation
on:
  push:
    branches: [tmp/resource-extractor-pools]
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/resource-extractor-pools
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Apply extractor pool patch
        run: |
          node scripts/tmp-add-extractor-pools.mjs
          node scripts/tmp-fix-extractor-test.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated implementation
        run: |
          rm scripts/tmp-add-extractor-pools.mjs
          rm scripts/tmp-fix-extractor-test.mjs
          rm .github/workflows/tmp-resource-extractor-pools.yml
          git fetch origin main
          git show origin/main:.github/workflows/deploy.yml > .github/workflows/deploy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add clay and stone extractor pools"
          git push origin HEAD:tmp/resource-extractor-pools
