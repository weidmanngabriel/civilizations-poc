name: Phase A branch check
on:
  push:
    branches: [agent/phase-a-spatial-rework]
concurrency:
  group: phase-a-spatial-rework
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run tests individually
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.ts; do
            echo "::group::$file"
            timeout 45s npx tsx --test "$file"
            echo "::endgroup::"
          done
# Temporary branch-only validation; remove before squash merge.
