name: Apply bread chain patch

on:
  push:
    branches:
      - feature/bread-chain-icons
    paths:
      - .github/workflows/apply-bread-chain.yml
      - .github/scripts/apply_bread_chain.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bread-chain-icons
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python .github/scripts/apply_bread_chain.py
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add bread production chain and visual icons"
          git push origin HEAD:feature/bread-chain-icons
# trigger
