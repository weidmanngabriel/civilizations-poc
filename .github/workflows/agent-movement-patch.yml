name: Agent movement performance patch

on:
  push:
    branches:
      - perf/movement-tile-lookup

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/movement-tile-lookup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path

          core = Path('src/simulation/simulationCoreEngine.ts')
          text = core.read_text()
          old_import = '''  movementCost,\n  pathTravelCost,\n  same,\n} from "./hex";'''
          new_import = '''  movementCost,\n  pathTravelCost,\n  same,\n  tileIndex,\n} from "./hex";'''
          if old_import not in text:
              raise SystemExit('hex import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_tile_at = '''const tileAt = (w: World, position: Hex): Tile =>\n  w.tiles.find((tile) => same(tile, position))!;'''
          new_tile_at = '''const tileAt = (w: World, position: Hex): Tile =>\n  tileIndex(w.tiles).get(key(position))!;'''
          if old_tile_at not in text:
              raise SystemExit('tileAt anchor not found')
          text = text.replace(old_tile_at, new_tile_at, 1)

          old_move_head = '''function movePeople(w: World): boolean {\n  let roadCreated = false;\n  const resourceCells = activeResourceCells(w);'''
          new_move_head = '''function movePeople(w: World): boolean {\n  let roadCreated = false;\n  const resourceCells = activeResourceCells(w);\n  const tiles = tileIndex(w.tiles);'''
          if old_move_head not in text:
              raise SystemExit('movePeople anchor not found')
          text = text.replace(old_move_head, new_move_head, 1)

          old_lookup = '''      const next = p.path[0]!;\n      const tile = tileAt(w, next);'''
          new_lookup = '''      const next = p.path[0]!;\n      const tile = tiles.get(key(next))!;'''
          if old_lookup not in text:
              raise SystemExit('movement lookup anchor not found')
          text = text.replace(old_lookup, new_lookup, 1)

          old_tick = '''  measureFeature("movement", () => {\n    if (movePeople(w)) {\n      for (const p of w.people) rerouteCurrentTask(w, p);\n    }\n    for (const p of w.people) {\n      if (movingAtTickStart.has(p.id) && p.path.length === 0)\n        immediateDecisionPeople.add(p.id);\n    }\n  });'''
          new_tick = '''  const roadCreated = measureFeature("movement", () => movePeople(w));\n  measureFeature("movementArrival", () => {\n    if (roadCreated) {\n      for (const p of w.people) rerouteCurrentTask(w, p);\n    }\n    for (const p of w.people) {\n      if (movingAtTickStart.has(p.id) && p.path.length === 0)\n        immediateDecisionPeople.add(p.id);\n    }\n  });'''
          if old_tick not in text:
              raise SystemExit('movement profiler anchor not found')
          core.write_text(text.replace(old_tick, new_tick, 1))

          profiler = Path('src/debug/performanceProfiler.ts')
          text = profiler.read_text()
          old_union = '''  | "movement"\n  | "transport"'''
          new_union = '''  | "movement"\n  | "movementArrival"\n  | "transport"'''
          if old_union not in text:
              raise SystemExit('profiler union anchor not found')
          text = text.replace(old_union, new_union, 1)
          old_features = '''  "movement",\n  "transport",'''
          new_features = '''  "movement",\n  "movementArrival",\n  "transport",'''
          if text.count(old_features) < 2:
              raise SystemExit('profiler feature anchors not found')
          text = text.replace(old_features, new_features)
          profiler.write_text(text)

          architecture = Path('architecture.md')
          text = architecture.read_text()
          old_arch = '''Natural-resource depletion retirement is event-driven; there is no periodic full resource-list cleanup scan. Farm physical-obstacle state is built once per farm-system tick, and road resource footprints once per movement tick. Placement anchor enumeration reuses indexed lookups. Further optimization should be driven by `src/debug/performanceProfiler.ts`, not speculative cache layers.'''
          new_arch = '''Natural-resource depletion retirement is event-driven; there is no periodic full resource-list cleanup scan. Farm physical-obstacle state is built once per farm-system tick, and road resource footprints once per movement tick. The movement hot path reuses the cached tile index instead of linearly scanning the full fine-grid tile array for every traversed micro-cell; arrival/reroute bookkeeping is profiled separately from traversal. Placement anchor enumeration reuses indexed lookups. Further optimization should be driven by `src/debug/performanceProfiler.ts`, not speculative cache layers.'''
          if old_arch not in text:
              raise SystemExit('architecture anchor not found')
          architecture.write_text(text.replace(old_arch, new_arch, 1))

          Path('.github/workflows/agent-movement-patch.yml').unlink()

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: optimize movement tile lookup"
          git push origin HEAD:perf/movement-tile-lookup
