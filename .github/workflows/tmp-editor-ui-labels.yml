name: Update editor UI labels
on:
  push:
    branches: [tmp/editor-ui-labels]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message != 'Apply editor UI labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/editor-ui-labels
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Update labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('building-editor/src/main.ts')
          text = path.read_text()
          replacements = {
              '<button class="secondary" id="import-building">Export importieren</button>': '<button class="secondary" id="import-building">Gebäudedefinition öffnen</button>',
              '<p class="help">Zum Import building.json und das zugehörige Sprite gemeinsam auswählen oder zusammen hier hineinziehen.</p>': '<p class="help">building.json und das zugehörige Sprite gemeinsam auswählen oder zusammen hier hineinziehen.</p>',
              '<label for="sprite-scale">Breite im Spiel <span id="scale-label">60 px</span></label>': '<label for="sprite-scale">Sprite-Breite im Spiel <span id="scale-label">60 Welt-px</span></label>',
              '<div class="field"><label for="scale-number">Breite (Welt-px)</label><input id="scale-number" type="number" min="0.1" max="1000" step="0.1" value="60" /></div>': '<div class="field"><label for="scale-number">Exakter Wert (Welt-px)</label><input id="scale-number" type="number" min="0.1" max="1000" step="0.1" value="60" /></div>',
              '<button class="tool active" data-tool="footprint">Grundriss</button>': '<button class="tool active" data-tool="footprint">Grundfläche</button>',
              '<button class="tool" data-tool="blocked">Blockiert</button>': '<button class="tool" data-tool="blocked">Blockierte Zellen</button>',
              '<h2>Sprite-Anchor</h2>': '<h2>Sprite-Ausrichtung</h2>',
              '<div class="field"><label for="anchor-x">X im Sprite (%)</label><input id="anchor-x" type="number" value="50" step="0.1" /></div>': '<div class="field"><label for="anchor-x">Ankerpunkt X (%)</label><input id="anchor-x" type="number" value="50" step="0.1" /></div>',
              '<div class="field"><label for="anchor-y">Y im Sprite (%)</label><input id="anchor-y" type="number" value="82" step="0.1" /></div>': '<div class="field"><label for="anchor-y">Ankerpunkt Y (%)</label><input id="anchor-y" type="number" value="82" step="0.1" /></div>',
              '<p class="help">Der Anchor-Punkt liegt auf q=0 / r=0. Er wird relativ zur Sprite-Größe gespeichert und bleibt deshalb bei einer anderen Quellauflösung an derselben Stelle.</p>': '<p class="help">Der Ankerpunkt liegt auf q=0 / r=0. Er wird relativ zur Sprite-Größe gespeichert und bleibt deshalb bei einer anderen Quellauflösung an derselben Stelle.</p>',
              '<button class="primary" id="download">Export herunterladen</button>': '<button class="${import.meta.env.DEV ? "secondary" : "primary"}" id="download">Dateien herunterladen</button>',
              '<button class="secondary" id="save-project" ${import.meta.env.DEV ? "" : "hidden"}>Ins Projekt speichern</button>': '<button class="primary" id="save-project" ${import.meta.env.DEV ? "" : "hidden"}>Direkt ins Projekt speichern</button>\n          <p class="help" ${import.meta.env.DEV ? "" : "hidden"}>Schreibt building.json und Sprite nach <code>src/assets/buildings/&lt;id&gt;/</code>.</p>',
              'scaleLabel.textContent = `${width} px`;': 'scaleLabel.textContent = `${width} Welt-px`; ',
              '`Bereit · ${footprint.size} Grundrisszellen, ${blocked.size} blockiert · ${roundedWorldWidth()} px Sprite-Breite.`': '`Bereit · ${footprint.size} Grundrisszellen, ${blocked.size} blockiert · ${roundedWorldWidth()} Welt-px Sprite-Breite.`',
              'refreshStatus("Export gestartet: building.json + unverändertes Sprite.");': 'refreshStatus("Dateien werden heruntergeladen: building.json + unverändertes Sprite.");',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit UI labels
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add building-editor/src/main.ts
          git commit -m 'Apply editor UI labels'
          git push origin HEAD:tmp/editor-ui-labels
