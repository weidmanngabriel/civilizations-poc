name: Agent branch check
on:
  push:
    branches: [agent/organic-paths-sim-speed]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Capture npm test output
        id: tests
        continue-on-error: true
        run: npm test > test-output.txt 2>&1
      - name: Save test output on branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-output.txt
          git commit -m "Capture branch test output" || true
          git push
      - name: Fail when tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - run: npm run build
