name: Agent branch check
on:
  push:
    branches: [agent/organic-paths-sim-speed]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: simulation tests
        continue-on-error: true
        run: npx tsx --test tests/simulation.test.ts
      - name: forest tests
        continue-on-error: true
        run: npx tsx --test tests/forest-relocation.test.ts
      - name: merchant tests
        continue-on-error: true
        run: npx tsx --test tests/merchant-routes.test.ts
      - name: worker tests
        continue-on-error: true
        run: npx tsx --test tests/worker-input.test.ts
      - name: production build
        run: npm run build
