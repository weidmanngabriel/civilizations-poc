name: Rebuild HQ sprite asset

on:
  push:
    branches: [tmp/asset-pipeline-hardening]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/asset-pipeline-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Rebuild and verify HQ sprite
        run: |
          cat .tmp/hq-sprite/chunk-* | base64 --decode > src/assets/buildings/headquarter/sprite.webp
          echo "bf5fcd9817230ac3d91773d3b42bde0a258212e95b6cc6df24d08e566d0fb3e2  src/assets/buildings/headquarter/sprite.webp" | sha256sum --check
          node scripts/validate-building-assets.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit verified binary asset
        run: |
          rm -rf .tmp/hq-sprite
          rm .github/workflows/rebuild-hq-asset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild verified HQ sprite asset"
          git push origin HEAD:tmp/asset-pipeline-hardening
