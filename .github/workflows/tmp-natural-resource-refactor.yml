name: Temporary natural resource refactor

on:
  push:
    branches:
      - tmp/natural-resource-nodes

permissions:
  contents: write

jobs:
  refactor-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/natural-resource-nodes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/tmp-natural-resource-refactor.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated refactor
        run: |
          rm scripts/tmp-natural-resource-refactor.mjs
          rm .github/workflows/tmp-natural-resource-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: model natural resources outside buildings"
          git push origin HEAD:tmp/natural-resource-nodes
