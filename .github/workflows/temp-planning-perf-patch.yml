name: Temporary planning performance patch
on:
  push:
    branches: [perf/split-and-reduce-work-planning]
permissions:
  contents: write
jobs:
  patch-test-build:
    if: github.event.head_commit.message != 'Apply work-planning performance patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/split-and-reduce-work-planning
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python scripts/temp_apply_planning_perf_patch.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/simulationCoreEngine.ts src/debug/performanceProfiler.ts src/ui/performanceDebug.ts architecture.md FINE_GRID_RESOURCE_REWORK_PLAN.md
          git commit -m "Apply work-planning performance patch"
          git push origin HEAD:perf/split-and-reduce-work-planning
